.layer-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 8px; }

function resolveCampuses(str) {
  if (!str) return [];
  return str.split("|").map(n => { const c = campusCoords[n.trim()]; return c ? { name: n.trim(), lat: c[0], lng: c[1], addr: c[2] } : null; }).filter(Boolean);
}

const osm = L.tileLayer("https://tile.openstreetmap.de/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap contributors", maxZoom: 19 });

document.getElementById("btnSatellite").addEventListener("click", () => {
  if (!map.hasLayer(satellite)) { map.removeLayer(osm); map.addLayer(satellite); }
  document.getElementById("btnSatellite").classList.add("active");
  document.getElementById("btnOsm").classList.remove("active");
});
document.getElementById("btnOsm").addEventListener("click", () => {

  document.getElementById("btnOsm").classList.add("active");
  document.getElementById("btnSatellite").classList.remove("active");
});

function getRank(schools) {
  for (const s of schools) {
    const r = schoolRank[s];
    if (r === "211") return "211";
    if (r === "yiliu") return "yiliu";
  }
  return "normal";
}

  const campuses = resolveCampuses(r[7]);
  campuses.forEach(c => {
    const key = c.name + "|" + c.lat + "|" + c.lng;
    if (added.has(key)) return;
    added.add(key);

    const schools = [...new Set(rows.filter(x => resolveCampuses(x[7]).some(xc => xc.name === c.name)).map(x => x[1]))];
    const majors = [...new Set(rows.filter(x => resolveCampuses(x[7]).some(xc => xc.name === c.name)).map(x => x[4]))];
    const labelHtml = schools.map(s => shortNames[s] || s).join("<br>");
    const rank = getRank(schools);

    const realLatLng = L.latLng(c.lat, c.lng);
    const marker = L.marker(realLatLng, {
      icon: L.divIcon({ className: "", html: `<div class="campus-label rank-${rank}">${labelHtml}</div>`, iconSize: null, iconAnchor: [0, 0] }),
      title: c.name

        <span style="color:#888;font-size:12px;">${c.addr}</span>
        <hr style="margin:6px 0;">
        <div style="font-size:12px;max-height:250px;overflow-y:auto;">

              ${pr ? `<div style="font-size:11px;color:#e67e22;margin-top:2px;">📍 ${pr.province}内排名 ${pr.rank}</div>` : ''}
            </div>`;
          }).join("")}
          <hr style="margin:6px 0;">

          ${majors.map(m => `<div style="padding-left:8px;color:#555;">• ${m}</div>`).join("")}
        </div>
      </div>
    `);
    markersLayer.addLayer(marker);
    markerItems.push({ marker, realLatLng });
  });
});

const spiderLines = L.layerGroup().addTo(map);
const OVERLAP_THRESHOLD = 50;
const SPREAD = 40;

function arrangeOverlappingMarkers() {
  spiderLines.clearLayers();

  const n = markerItems.length;
  if (n === 0) return;

  const pixels = markerItems.map(item => map.latLngToContainerPoint(item.realLatLng));

  const adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (pixels[i].distanceTo(pixels[j]) < OVERLAP_THRESHOLD) {
        adj[i].push(j);
        adj[j].push(i);
      }
    }
  }

  const visited = new Set();
  for (let i = 0; i < n; i++) {
    if (visited.has(i)) continue;
    const group = [];
    const queue = [i];
    visited.add(i);
    while (queue.length) {
      const idx = queue.shift();
      group.push(idx);
      for (const nb of adj[idx]) {
        if (!visited.has(nb)) {
          visited.add(nb);
          queue.push(nb);
        }
      }
    }
    if (group.length < 2) {
      markerItems[i].marker.setLatLng(markerItems[i].realLatLng);
      continue;
    }

    const cx = group.reduce((s, idx) => s + pixels[idx].x, 0) / group.length;
    const cy = group.reduce((s, idx) => s + pixels[idx].y, 0) / group.length;

    group.sort((a, b) => pixels[a].x - pixels[b].x);

    group.forEach((idx, pos) => {
      const offset = (pos - (group.length - 1) / 2) * SPREAD;
      const newPixel = L.point(cx + offset, cy);
      const newLatLng = map.containerPointToLatLng(newPixel);
      markerItems[idx].marker.setLatLng(newLatLng);

      const line = L.polyline([newLatLng, markerItems[idx].realLatLng], {
        color: '#1a73e8', weight: 2, opacity: 0.5, dashArray: '4, 4'
      });
      spiderLines.addLayer(line);
    });
  }
}

const bounds = markersLayer.getBounds();
if (bounds.isValid()) {
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
}
map.on('moveend zoomend', arrangeOverlappingMarkers);
setTimeout(arrangeOverlappingMarkers, 200);
